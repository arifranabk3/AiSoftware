name: ARM64 Container Build & Native Verification

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'package*.json'
      - 'docker-compose.production.yml'
      - '.github/workflows/arm64-docker-build.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'package*.json'
      - 'docker-compose.production.yml'
      - '.github/workflows/arm64-docker-build.yml'

jobs:
  arm64-build-and-verify:
    name: Build & Verify ARM64 Container Images
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ai-command-center-api:arm64-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker Image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ai-command-center-worker:arm64-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Native argon2 Cryptographic Operations on ARM64
        run: |
          set -euo pipefail
          echo "Executing argon2 hash, positive verify, and negative verify under linux/arm64..."
          docker run --rm --platform linux/arm64 ai-command-center-api:arm64-test \
            node -e "const argon = require('argon2'); (async () => {
              const hash = await argon.hash('SecurePassword123!');
              const valid = await argon.verify(hash, 'SecurePassword123!');
              if (!valid) {
                console.error('[FAIL] Correct password verification failed');
                process.exit(1);
              }
              const invalid = await argon.verify(hash, 'WrongPassword!');
              if (invalid) {
                console.error('[FAIL] Incorrect password was accepted');
                process.exit(1);
              }
              console.log('[PASS] Native module argon2 cryptographic hash & negative verification passed on ARM64.');
              process.exit(0);
            })();"

      - name: Test API Container Startup, Health Endpoint & Graceful Shutdown
        run: |
          set -euo pipefail
          echo "Starting API container on linux/arm64..."
          API_CID=""
          cleanup_api() {
            if [ -n "$API_CID" ]; then
              echo "Cleaning up API container $API_CID..."
              docker rm -f "$API_CID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_api EXIT

          API_CID=$(docker run -d --platform linux/arm64 \
            --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e JWT_SECRET=test_jwt_secret_must_be_32_characters_long_123 \
            -e REFRESH_TOKEN_SECRET=test_refresh_secret_must_be_32_characters_long \
            -e MASTER_ENCRYPTION_KEY=test_master_encryption_key_32_char \
            -e MONGODB_URI="mongodb://127.0.0.1:27017/ai_command_center" \
            ai-command-center-api:arm64-test)

          echo "Container started: $API_CID"

          echo "Bounded readiness polling for API health endpoint (max 30s)..."
          READY=0
          for i in $(seq 1 30); do
            RUNNING=$(docker inspect -f '{{.State.Running}}' "$API_CID" 2>/dev/null || echo "false")
            if [ "$RUNNING" != "true" ]; then
              echo "[FAIL] API container exited unexpectedly before becoming ready!"
              docker logs "$API_CID"
              exit 1
            fi
            if HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/v1/system/health); then
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "[PASS] API endpoint ready and returned HTTP 200 after ${i}s."
                READY=1
                break
              fi
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "[FAIL] Timed out waiting for API health endpoint to return HTTP 200."
            docker logs "$API_CID"
            exit 1
          fi

          echo "Sending SIGTERM to API container..."
          docker kill --signal=SIGTERM "$API_CID"

          echo "Waiting for API process clean exit (max 10s)..."
          EXIT_DETECTED=0
          for i in $(seq 1 10); do
            RUNNING=$(docker inspect -f '{{.State.Running}}' "$API_CID")
            if [ "$RUNNING" != "true" ]; then
              EXIT_DETECTED=1
              break
            fi
            sleep 1
          done

          if [ "$EXIT_DETECTED" -ne 1 ]; then
            echo "[FAIL] API container did not exit within 10s after SIGTERM."
            docker logs "$API_CID"
            exit 1
          fi

          API_EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$API_CID")
          echo "API Container exit code: $API_EXIT_CODE"
          if [ "$API_EXIT_CODE" -ne 0 ]; then
            echo "[FAIL] API container exit code was $API_EXIT_CODE (expected 0)."
            docker logs "$API_CID"
            exit 1
          fi

          echo "Inspecting API shutdown logs:"
          docker logs "$API_CID"
          echo "[PASS] API container passed startup, readiness, HTTP 200 health verification, and SIGTERM clean shutdown."

      - name: Test Worker Container Startup, Dependency Initialization & Graceful Shutdown
        run: |
          set -euo pipefail
          echo "Starting Worker container on linux/arm64..."
          WORKER_WID=""
          cleanup_worker() {
            if [ -n "$WORKER_WID" ]; then
              echo "Cleaning up Worker container $WORKER_WID..."
              docker rm -f "$WORKER_WID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_worker EXIT

          WORKER_WID=$(docker run -d --platform linux/arm64 \
            --network host \
            -e NODE_ENV=production \
            -e MONGODB_URI="mongodb://127.0.0.1:27017/ai_command_center" \
            -e REDIS_URL="redis://127.0.0.1:6379" \
            -e MASTER_ENCRYPTION_KEY=test_master_encryption_key_32_char \
            ai-command-center-worker:arm64-test)

          echo "Worker container started: $WORKER_WID"

          echo "Bounded readiness polling for Worker dependency connections (max 30s)..."
          CONNECTED=0
          for i in $(seq 1 30); do
            WRUNNING=$(docker inspect -f '{{.State.Running}}' "$WORKER_WID" 2>/dev/null || echo "false")
            if [ "$WRUNNING" != "true" ]; then
              echo "[FAIL] Worker container exited unexpectedly before initializing dependencies!"
              docker logs "$WORKER_WID"
              exit 1
            fi
            LOGS=$(docker logs "$WORKER_WID" 2>&1 || true)
            if echo "$LOGS" | grep -q "Redis Status: CONNECTED" && echo "$LOGS" | grep -q "MongoDB Status: CONNECTED"; then
              echo "[PASS] Worker confirmed both Redis and MongoDB are CONNECTED after ${i}s."
              CONNECTED=1
              break
            fi
            sleep 1
          done

          if [ "$CONNECTED" -ne 1 ]; then
            echo "[FAIL] Worker failed to connect to Redis and MongoDB within 30s."
            docker logs "$WORKER_WID"
            exit 1
          fi

          echo "Sending SIGTERM to Worker container..."
          docker kill --signal=SIGTERM "$WORKER_WID"

          echo "Waiting for Worker clean exit (max 10s)..."
          W_EXIT_DETECTED=0
          for i in $(seq 1 10); do
            WRUNNING=$(docker inspect -f '{{.State.Running}}' "$WORKER_WID")
            if [ "$WRUNNING" != "true" ]; then
              W_EXIT_DETECTED=1
              break
            fi
            sleep 1
          done

          if [ "$W_EXIT_DETECTED" -ne 1 ]; then
            echo "[FAIL] Worker container did not exit within 10s after SIGTERM."
            docker logs "$WORKER_WID"
            exit 1
          fi

          WORKER_EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$WORKER_WID")
          echo "Worker Container exit code: $WORKER_EXIT_CODE"
          if [ "$WORKER_EXIT_CODE" -ne 0 ]; then
            echo "[FAIL] Worker container exit code was $WORKER_EXIT_CODE (expected 0)."
            docker logs "$WORKER_WID"
            exit 1
          fi

          echo "Inspecting Worker shutdown logs:"
          docker logs "$WORKER_WID"
          echo "[PASS] Worker container successfully initialized Redis + MongoDB dependencies and shut down with exit code 0."
