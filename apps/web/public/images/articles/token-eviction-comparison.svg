<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-evict" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrow-evict" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-evict)" rx="12" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" rx="8" />

  <!-- Title -->
  <text x="400" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Comparative Token Eviction Strategies in Production Agents</text>
  <text x="400" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Analyzing architectural trade-offs between FIFO, Semantic RAG, and Hierarchical Summarization</text>

  <!-- Strategy 1: Naive FIFO Truncation -->
  <g transform="translate(45, 115)">
    <rect width="215" height="280" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <rect width="215" height="32" rx="10" fill="#b91c1c" />
    <text x="107" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Naive FIFO Truncation</text>
    
    <text x="15" y="60" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Mechanism:</text>
    <text x="15" y="80" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Drops oldest turns immediately when buffer fills.</text>

    <text x="15" y="115" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Fatal Vulnerability:</text>
    <text x="15" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Drops original user goals</text>
    <text x="15" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Causes goal drift in turn 15+</text>
    <text x="15" y="169" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Agent repeats failed actions</text>

    <text x="15" y="210" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Complexity &amp; Cost:</text>
    <text x="15" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• O(1) Time, 0 compute</text>
    <text x="15" y="260" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Verdict: UNACCEPTABLE</text>
  </g>

  <!-- Strategy 2: Vector RAG Retrieval -->
  <g transform="translate(290, 115)">
    <rect width="220" height="280" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect width="220" height="32" rx="10" fill="#2563eb" />
    <text x="110" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Semantic Vector RAG</text>
    
    <text x="15" y="60" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Mechanism:</text>
    <text x="15" y="80" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Embeds all turns into vector DB; retrieves top-k chunks.</text>

    <text x="15" y="115" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Operational Failure:</text>
    <text x="15" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Destroys temporal sequence</text>
    <text x="15" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• High embedding latency</text>
    <text x="15" y="169" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Misses state transitions</text>

    <text x="15" y="210" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Complexity &amp; Cost:</text>
    <text x="15" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• High (Vector DB + embeddings)</text>
    <text x="15" y="260" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Verdict: SUB-OPTIMAL</text>
  </g>

  <!-- Strategy 3: Sliding Buffer + Compaction (Gold Standard) -->
  <g transform="translate(540, 115)">
    <rect width="220" height="280" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
    <rect width="220" height="32" rx="10" fill="#059669" />
    <text x="110" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. Pinned Buffer + Compaction</text>
    
    <text x="15" y="60" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Mechanism:</text>
    <text x="15" y="80" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Pins system goals, rolls summaries, keeps N raw turns.</text>

    <text x="15" y="115" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Architectural Strengths:</text>
    <text x="15" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Preserves core goals 100%</text>
    <text x="15" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Intact conversational syntax</text>
    <text x="15" y="169" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Guaranteed output headroom</text>

    <text x="15" y="210" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Complexity &amp; Cost:</text>
    <text x="15" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Deterministic &amp; zero-cost local</text>
    <text x="15" y="260" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Verdict: PRODUCTION STANDARD</text>
  </g>
</svg>

