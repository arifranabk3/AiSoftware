<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="redisGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Atomic Redis Lua Token Bucket State Machine</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Thread-Safe Refill Calculation, Atomicity Guarantees, and Quota Decisions</text>

  <!-- Step 1: Incoming Evaluation -->
  <rect x="40" y="110" width="220" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="40" y="110" width="220" height="30" rx="8" fill="#1e293b" />
  <text x="55" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Client Request Hook</text>
  <text x="55" y="160" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">&#8226; Client ID / IP / API Key</text>
  <text x="55" y="180" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">&#8226; Requested Tokens (W)</text>
  <text x="55" y="200" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">&#8226; Current Timestamp (now)</text>
  <text x="55" y="235" fill="#64748b" font-family="monospace" font-size="11">EVALSHA token_bucket</text>

  <!-- Flow Arrow to Redis -->
  <path d="M 260 185 L 320 185" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Atomic Lua Engine in Redis -->
  <rect x="320" y="95" width="280" height="340" rx="8" fill="#171216" stroke="#ef4444" stroke-width="1.5" />
  <rect x="320" y="95" width="280" height="35" rx="8" fill="url(#redisGrad)" />
  <text x="340" y="118" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Single-Threaded Lua Sandbox</text>

  <rect x="335" y="145" width="250" height="70" rx="6" fill="#090d16" stroke="#334155" stroke-width="1" />
  <text x="345" y="165" fill="#fca5a5" font-family="monospace" font-size="11">delta = max(0, now - last_time)</text>
  <text x="345" y="185" fill="#fca5a5" font-family="monospace" font-size="11">refill = delta * refill_rate</text>
  <text x="345" y="205" fill="#fca5a5" font-family="monospace" font-size="11">tokens = min(cap, tokens + refill)</text>

  <text x="345" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Decision Condition:</text>
  <rect x="335" y="255" width="250" height="40" rx="4" fill="#1e1e2e" stroke="#475569" stroke-width="1" />
  <text x="345" y="280" fill="#fbbf24" font-family="monospace" font-size="12">if tokens &gt;= requested then</text>

  <text x="345" y="320" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&#8226; Decrement: tokens = tokens - req</text>
  <text x="345" y="340" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&#8226; Set key: HMSET tokens, now</text>
  <text x="345" y="360" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&#8226; Set TTL: EXPIRE key 3600</text>
  <text x="345" y="390" fill="#22c55e" font-family="monospace" font-size="11">return {1, remaining, reset_sec}</text>
  <text x="345" y="410" fill="#ef4444" font-family="monospace" font-size="11">else return {0, remaining, retry_ms}</text>

  <!-- Flow Arrows from Redis -->
  <path d="M 600 240 L 670 200" fill="none" stroke="#22c55e" stroke-width="2" />
  <path d="M 600 300 L 670 340" fill="none" stroke="#ef4444" stroke-width="2" />

  <!-- Step 3A: Allowed Outcome -->
  <rect x="670" y="145" width="190" height="110" rx="8" fill="#0f231d" stroke="#22c55e" stroke-width="1.5" />
  <text x="685" y="172" fill="#4ade80" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3A. Allowed (200 OK)</text>
  <text x="685" y="195" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">&#8226; Pass request to upstream</text>
  <text x="685" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">&#8226; Add headers:</text>
  <text x="685" y="235" fill="#86efac" font-family="monospace" font-size="10">X-RateLimit-Remaining: 74</text>

  <!-- Step 3B: Throttled Outcome -->
  <rect x="670" y="295" width="190" height="110" rx="8" fill="#251214" stroke="#ef4444" stroke-width="1.5" />
  <text x="685" y="322" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3B. Throttled (429)</text>
  <text x="685" y="345" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">&#8226; Fast-fail without LLM call</text>
  <text x="685" y="365" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">&#8226; Add headers:</text>
  <text x="685" y="385" fill="#fca5a5" font-family="monospace" font-size="10">Retry-After: 3.2</text>
</svg>
