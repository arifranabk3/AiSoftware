<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMerkle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgMerkle1)" stroke="#334155" stroke-width="2" />

  <text x="40" y="50" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FIGURE 1: MERKLE INCLUSION PROOF VERIFICATION</text>
  <text x="40" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Verifying Target Leaf Event Using Minimal Audit Path</text>

  <!-- Left: Tree Graph with Audit Path Highlighted -->
  <rect x="40" y="120" width="420" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  
  <!-- Root -->
  <rect x="170" y="140" width="160" height="40" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="2" />
  <text x="250" y="165" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ROOT HASH</text>

  <!-- Connectors -->
  <line x1="220" y1="180" x2="140" y2="215" stroke="#818cf8" stroke-width="2" />
  <line x1="280" y1="180" x2="360" y2="215" stroke="#475569" stroke-width="1.5" />

  <!-- Intermediate Layer -->
  <rect x="70" y="215" width="140" height="35" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  <text x="140" y="238" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="middle">H_12 = Hash(H1+H2)</text>

  <rect x="290" y="215" width="140" height="35" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="360" y="238" fill="#fef08a" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">SIBLING H_34 (PATH)</text>

  <!-- Connectors to leaves -->
  <line x1="110" y1="250" x2="80" y2="285" stroke="#10b981" stroke-width="2" />
  <line x1="170" y1="250" x2="200" y2="285" stroke="#f59e0b" stroke-width="2" />

  <!-- Leaves -->
  <rect x="50" y="285" width="80" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2" />
  <text x="90" y="308" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">TARGET</text>
  <text x="90" y="324" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">Event #1</text>

  <rect x="160" y="285" width="80" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="200" y="308" fill="#fef08a" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">SIBLING H2</text>
  <text x="200" y="324" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Audit Path</text>

  <text x="250" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Proof size for 1M events: 20 hashes (~640 bytes total)</text>

  <!-- Right: Verification Step Walkthrough -->
  <rect x="480" y="120" width="280" height="300" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="505" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Audit Proof Steps:</text>
  
  <rect x="500" y="170" width="240" height="55" rx="8" fill="#0f172a" />
  <text x="515" y="192" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="700">1. Hash Target Leaf Data:</text>
  <text x="515" y="210" fill="#94a3b8" font-family="monospace" font-size="9">H1 = SHA-256(Event #1 JSON)</text>

  <rect x="500" y="235" width="240" height="55" rx="8" fill="#0f172a" />
  <text x="515" y="257" fill="#fef08a" font-family="monospace" font-size="10" font-weight="700">2. Combine with Sibling H2:</text>
  <text x="515" y="275" fill="#94a3b8" font-family="monospace" font-size="9">H_12 = SHA-256(H1 + H2)</text>

  <rect x="500" y="300" width="240" height="55" rx="8" fill="#0f172a" />
  <text x="515" y="322" fill="#818cf8" font-family="monospace" font-size="10" font-weight="700">3. Combine with Sibling H_34:</text>
  <text x="515" y="340" fill="#94a3b8" font-family="monospace" font-size="9">H_CALC = SHA-256(H_12 + H_34)</text>

  <text x="505" y="385" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">If H_CALC == H_ROOT: VERIFIED</text>
</svg>
