<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <marker id="ptrArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="900" height="480" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Virtual Memory Page Table Architecture for KV Cache</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Translating Logical Token Key-Value Sequences to Discrete Physical GPU Memory Frames</text>

  <!-- Left: Logical Contiguous Tokens -->
  <rect x="40" y="100" width="240" height="340" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="55" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Logical KV Buffer</text>
  <text x="55" y="150" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Contiguous Address Space</text>

  <g transform="translate(55, 170)">
    <rect x="0" y="0" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="25" fill="#f1f5f9" font-family="monospace" font-size="12">Logical Block 0</text>
    <text x="15" y="40" fill="#94a3b8" font-family="monospace" font-size="10">Tokens [0 .. 15]</text>

    <rect x="0" y="65" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="90" fill="#f1f5f9" font-family="monospace" font-size="12">Logical Block 1</text>
    <text x="15" y="105" fill="#94a3b8" font-family="monospace" font-size="10">Tokens [16 .. 31]</text>

    <rect x="0" y="130" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="155" fill="#f1f5f9" font-family="monospace" font-size="12">Logical Block 2</text>
    <text x="15" y="170" fill="#94a3b8" font-family="monospace" font-size="10">Tokens [32 .. 47]</text>

    <rect x="0" y="195" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="220" fill="#f1f5f9" font-family="monospace" font-size="12">Logical Block 3</text>
    <text x="15" y="235" fill="#94a3b8" font-family="monospace" font-size="10">Tokens [48 .. 63]</text>
  </g>

  <!-- Center: Block Table Translation Engine -->
  <rect x="330" y="100" width="240" height="340" rx="8" fill="#091b2e" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="345" y="130" fill="#0ea5e9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Block Table Lookup</text>
  <text x="345" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Kernel Page Table Mapping</text>

  <g transform="translate(345, 170)">
    <rect x="0" y="0" width="210" height="50" rx="6" fill="#0c2642" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="25" fill="#e0f2fe" font-family="monospace" font-size="11">Block 0 â†’ Frame 8</text>
    <text x="15" y="40" fill="#38bdf8" font-family="monospace" font-size="9">VRAM Base 0x7F08000</text>

    <rect x="0" y="65" width="210" height="50" rx="6" fill="#0c2642" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="90" fill="#e0f2fe" font-family="monospace" font-size="11">Block 1 â†’ Frame 3</text>
    <text x="15" y="105" fill="#38bdf8" font-family="monospace" font-size="9">VRAM Base 0x7F03000</text>

    <rect x="0" y="130" width="210" height="50" rx="6" fill="#0c2642" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="155" fill="#e0f2fe" font-family="monospace" font-size="11">Block 2 â†’ Frame 14</text>
    <text x="15" y="170" fill="#38bdf8" font-family="monospace" font-size="9">VRAM Base 0x7F0E000</text>

    <rect x="0" y="195" width="210" height="50" rx="6" fill="#0c2642" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="220" fill="#e0f2fe" font-family="monospace" font-size="11">Block 3 â†’ Frame 1</text>
    <text x="15" y="235" fill="#38bdf8" font-family="monospace" font-size="9">VRAM Base 0x7F01000</text>
  </g>

  <!-- Right: Physical GPU Memory Non-contiguous Frames -->
  <rect x="620" y="100" width="240" height="340" rx="8" fill="#061e17" stroke="#10b981" stroke-width="1.5" />
  <text x="635" y="130" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Physical GPU Frames</text>
  <text x="635" y="150" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Non-contiguous Allocation</text>

  <g transform="translate(635, 170)">
    <rect x="0" y="0" width="210" height="50" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="15" y="25" fill="#ffffff" font-family="monospace" font-size="12">Frame 1 (Block 3)</text>
    <text x="15" y="40" fill="#a7f3d0" font-family="monospace" font-size="10">Active: 16 Tokens</text>

    <rect x="0" y="65" width="210" height="50" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="15" y="90" fill="#ffffff" font-family="monospace" font-size="12">Frame 3 (Block 1)</text>
    <text x="15" y="105" fill="#a7f3d0" font-family="monospace" font-size="10">Active: 16 Tokens</text>

    <rect x="0" y="130" width="210" height="50" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="15" y="155" fill="#ffffff" font-family="monospace" font-size="12">Frame 8 (Block 0)</text>
    <text x="15" y="170" fill="#a7f3d0" font-family="monospace" font-size="10">Active: 16 Tokens</text>

    <rect x="0" y="195" width="210" height="50" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="15" y="220" fill="#ffffff" font-family="monospace" font-size="12">Frame 14 (Block 2)</text>
    <text x="15" y="235" fill="#a7f3d0" font-family="monospace" font-size="10">Active: 16 Tokens</text>
  </g>

  <!-- Connectors -->
  <line x1="280" y1="195" x2="330" y2="195" stroke="#38bdf8" stroke-width="2" marker-end="url(#ptrArrow)" />
  <line x1="570" y1="195" x2="620" y2="325" stroke="#10b981" stroke-width="2" marker-end="url(#ptrArrow)" />
</svg>

