<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBoxSand1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgBoxSand1)" stroke="#334155" stroke-width="2" />

  <text x="40" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FIGURE 1: MULTI-TIER AGENT SANDBOX ISOLATION</text>
  <text x="40" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Four Defense Layers Between Untrusted AI Code and Host OS</text>

  <!-- Layer 1: Host Environment (Outer) -->
  <rect x="40" y="120" width="720" height="300" rx="14" fill="#031828" stroke="#475569" stroke-width="2" />
  <text x="60" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LAYER 1: HOST OPERATING SYSTEM (Linux Kernel / Host FS Protected)</text>

  <!-- Layer 2: cgroups and Namespace boundary -->
  <rect x="80" y="170" width="640" height="230" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="2" />
  <text x="100" y="198" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LAYER 2: LINUX NAMESPACES (PID, Mount, IPC, Network, User)</text>

  <!-- Layer 3: Seccomp-BPF & Capabilities -->
  <rect x="120" y="215" width="560" height="165" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
  <text x="140" y="240" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">LAYER 3: SECCOMP-BPF SYSCALL FILTER (Blocks 300+ Unnecessary Syscalls)</text>

  <!-- Layer 4: The Agent Execution Sandbox -->
  <rect x="150" y="255" width="500" height="105" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <rect x="150" y="255" width="500" height="6" rx="3" fill="#10b981" />
  <text x="170" y="282" fill="#86efac" font-family="system-ui, sans-serif" font-size="13" font-weight="800">LAYER 4: ISOLATED WORKER CONTAINER</text>
  <text x="170" y="302" fill="#cbd5e1" font-family="monospace" font-size="11">Execution: python script.py in /tmp (tmpfs)</text>
  <text x="170" y="322" fill="#94a3b8" font-family="monospace" font-size="10">Mounts: Read-Only Root • No Host Sockets • Memory Cap: 512MB</text>
  <text x="170" y="342" fill="#10b981" font-family="system-ui" font-size="11" font-weight="700">Exploit Blast Radius: Strictly Confined</text>
</svg>
