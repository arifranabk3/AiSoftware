<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="badGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Memory Fragmentation: Traditional KV Allocation vs. PagedAttention</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Empirical Comparison of Internal Waste, External Fragmentation, and Effective Concurrency</text>

  <!-- Left: Traditional Pre-allocated Contiguous KV -->
  <rect x="40" y="100" width="390" height="340" rx="8" fill="#181116" stroke="#ef4444" stroke-width="1.5" />
  <rect x="40" y="100" width="390" height="36" rx="8" fill="#7f1d1d" />
  <text x="55" y="124" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Traditional Static Contiguous Allocation</text>

  <g transform="translate(55, 155)">
    <text x="0" y="15" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Max Sequence Pre-allocation (2,048 Tokens Reserved)</text>
    
    <!-- Big buffer with small actual usage -->
    <rect x="0" y="25" width="360" height="45" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <rect x="0" y="25" width="90" height="45" rx="4" fill="#ef4444" fill-opacity="0.8" />
    <text x="12" y="52" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">Actual (25%)</text>
    <text x="120" y="52" fill="#94a3b8" font-family="monospace" font-size="11">Internal Waste (75% Reserved Unused)</text>

    <!-- Request 2 -->
    <text x="0" y="100" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Dynamic Request 2 (Variable Arrival)</text>
    <rect x="0" y="110" width="360" height="45" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <rect x="0" y="110" width="140" height="45" rx="4" fill="#ef4444" fill-opacity="0.8" />
    <text x="25" y="137" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">Actual (38%)</text>
    <text x="170" y="137" fill="#94a3b8" font-family="monospace" font-size="11">Internal Waste (62%)</text>

    <!-- Waste Metrics -->
    <rect x="0" y="180" width="360" height="75" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1" />
    <text x="14" y="205" fill="#fecaca" font-family="system-ui, sans-serif" font-size="12" font-weight="700">VRAM Overhead Metrics</text>
    <text x="14" y="225" fill="#f87171" font-family="system-ui, sans-serif" font-size="11">&#8226; 60-80% VRAM wasted on unallocated space</text>
    <text x="14" y="243" fill="#f87171" font-family="system-ui, sans-serif" font-size="11">&#8226; OOM crash risk when sequences exceed max length</text>
  </g>

  <!-- Right: PagedAttention Dynamic Frame Allocation -->
  <rect x="470" y="100" width="390" height="340" rx="8" fill="#081c15" stroke="#10b981" stroke-width="1.5" />
  <rect x="470" y="100" width="390" height="36" rx="8" fill="#065f46" />
  <text x="485" y="124" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">PagedAttention On-Demand Paged Allocation</text>

  <g transform="translate(485, 155)">
    <text x="0" y="15" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Dynamic 16-Token Discrete Block Allocation</text>
    
    <!-- Dynamic blocks filled tightly -->
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="40" height="45" rx="4" fill="#10b981" />
      <rect x="44" y="0" width="40" height="45" rx="4" fill="#10b981" />
      <rect x="88" y="0" width="40" height="45" rx="4" fill="#10b981" />
      <rect x="132" y="0" width="40" height="45" rx="4" fill="#10b981" />
      <rect x="176" y="0" width="40" height="45" rx="4" fill="#10b981" />
      <rect x="220" y="0" width="40" height="45" rx="4" fill="#10b981" fill-opacity="0.4" stroke="#10b981" />
      <text x="226" y="27" fill="#6ee7b7" font-family="monospace" font-size="9">tail</text>
      <rect x="264" y="0" width="96" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-dasharray="3,3" />
      <text x="280" y="27" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Free Frame Pool</text>
    </g>

    <!-- Request 2 sharing free pool -->
    <text x="0" y="100" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Multi-Tenant Request Sharing</text>
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="40" height="45" rx="4" fill="#0ea5e9" />
      <rect x="44" y="0" width="40" height="45" rx="4" fill="#0ea5e9" />
      <rect x="88" y="0" width="40" height="45" rx="4" fill="#0ea5e9" />
      <rect x="132" y="0" width="40" height="45" rx="4" fill="#0ea5e9" fill-opacity="0.4" stroke="#0ea5e9" />
      <text x="138" y="27" fill="#7dd3fc" font-family="monospace" font-size="9">tail</text>
      <rect x="176" y="0" width="184" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-dasharray="3,3" />
      <text x="230" y="27" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Available for Batches</text>
    </g>

    <!-- Paged Metrics -->
    <rect x="0" y="180" width="360" height="75" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="14" y="205" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Efficiency Improvements</text>
    <text x="14" y="225" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">&#8226; &lt;4% internal fragmentation across all sequences</text>
    <text x="14" y="243" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">&#8226; 2x &#8211; 4x higher parallel inference throughput</text>
  </g>
</svg>

