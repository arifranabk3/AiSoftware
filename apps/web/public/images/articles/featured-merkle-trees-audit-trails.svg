<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMerkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadowMerkle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#818cf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradMerkle)" />

  <g stroke="#1e293b" stroke-width="1" opacity="0.3">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Left: Binary Merkle Tree Visualization -->
  <g filter="url(#shadowMerkle)">
    <!-- Root Node -->
    <rect x="230" y="140" width="180" height="60" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="2.5" />
    <text x="320" y="167" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">MERKLE ROOT</text>
    <text x="320" y="187" fill="#c7d2fe" font-family="monospace" font-size="11" text-anchor="middle">H_ROOT (SHA-256)</text>

    <!-- Branch Lines -->
    <line x1="280" y1="200" x2="200" y2="250" stroke="#818cf8" stroke-width="2.5" />
    <line x1="360" y1="200" x2="440" y2="250" stroke="#818cf8" stroke-width="2.5" />

    <!-- Intermediate Nodes -->
    <rect x="120" y="250" width="160" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="200" y="280" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">H_AB = H(A + B)</text>

    <rect x="360" y="250" width="160" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="440" y="280" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">H_CD = H(C + D)</text>

    <!-- Leaf Branch Lines -->
    <line x1="160" y1="300" x2="135" y2="340" stroke="#475569" stroke-width="2" />
    <line x1="240" y1="300" x2="265" y2="340" stroke="#475569" stroke-width="2" />
    <line x1="400" y1="300" x2="375" y2="340" stroke="#475569" stroke-width="2" />
    <line x1="480" y1="300" x2="505" y2="340" stroke="#475569" stroke-width="2" />

    <!-- Leaf Nodes (Data Events) -->
    <rect x="90" y="340" width="90" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="135" y="365" fill="#86efac" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">LEAF A</text>
    <text x="135" y="385" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Prompt Evt</text>

    <rect x="220" y="340" width="90" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="265" y="365" fill="#86efac" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">LEAF B</text>
    <text x="265" y="385" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Inference</text>

    <rect x="330" y="340" width="90" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="375" y="365" fill="#86efac" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">LEAF C</text>
    <text x="375" y="385" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Approval</text>

    <rect x="460" y="340" width="90" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="505" y="365" fill="#86efac" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">LEAF D</text>
    <text x="505" y="385" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Output Run</text>

    <!-- Verification Proof Box -->
    <rect x="120" y="435" width="400" height="75" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
    <text x="140" y="462" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800">O(log N) Cryptographic Audit Proof:</text>
    <text x="140" y="485" fill="#f8fafc" font-family="monospace" font-size="11">Verify 1M records in just 20 hash operations</text>
  </g>

  <!-- Right: Architecture Benefit Cards -->
  <g>
    <rect x="600" y="140" width="480" height="105" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="600" y="140" width="10" height="105" rx="5" fill="#818cf8" />
    <text x="630" y="175" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800">1. Mathematical Tamper-Evidence</text>
    <text x="630" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Mutating a single historical record invalidates root hash</text>
    <text x="630" y="222" fill="#c7d2fe" font-family="monospace" font-size="11">Guarantees: Zero silent log deletion or retro-active edits</text>
  </g>

  <g>
    <rect x="600" y="275" width="480" height="105" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="600" y="275" width="10" height="105" rx="5" fill="#10b981" />
    <text x="630" y="310" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800">2. Append-Only Operational Ledger</text>
    <text x="630" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Chains every autonomous AI agent decision sequentially</text>
    <text x="630" y="357" fill="#86efac" font-family="monospace" font-size="11">Data Model: prevHash SHA-256 link in MongoDB events</text>
  </g>

  <g>
    <rect x="600" y="410" width="480" height="105" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="600" y="410" width="10" height="105" rx="5" fill="#38bdf8" />
    <text x="630" y="445" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800">3. Lightweight External Anchoring</text>
    <text x="630" y="470" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Publish periodic Merkle roots to public transparency logs</text>
    <text x="630" y="492" fill="#38bdf8" font-family="monospace" font-size="11">Compliance: Defeats internal privileged DBA tampering</text>
  </g>

  <!-- Category Tag -->
  <rect x="120" y="65" width="220" height="36" rx="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
  <circle cx="138" cy="83" r="5" fill="#818cf8" />
  <text x="152" y="88" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CRYPTOGRAPHY &amp; AUDITING</text>

  <!-- Brand Mark -->
  <text x="1080" y="585" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">AIsoftware Engineering Library</text>
</svg>
