<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="796" height="446" rx="14" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <text x="40" y="50" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FIGURE 2: QUANTIZATION BENCHMARK & SYSTEM THROUGHPUT</text>
  <text x="40" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Precision (Q4_K_M vs FP16) vs Speed & Memory Footprint</text>

  <!-- Table Container -->
  <rect x="40" y="110" width="720" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Table Headers -->
  <rect x="40" y="110" width="720" height="40" rx="12" fill="#1e293b" />
  <text x="60" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">QUANTIZATION FORMAT</text>
  <text x="260" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RAM / VRAM REQUIRED</text>
  <text x="450" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TOKENS / SECOND (M2 / RTX)</text>
  <text x="660" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ACCURACY RETENTION</text>

  <!-- Row 1 -->
  <text x="60" y="180" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700">FP16 (Unquantized 7B)</text>
  <text x="260" y="180" fill="#fca5a5" font-family="monospace" font-size="13">14.8 GB</text>
  <text x="450" y="180" fill="#cbd5e1" font-family="monospace" font-size="13">18 - 24 t/s</text>
  <text x="660" y="180" fill="#cbd5e1" font-family="monospace" font-size="13">100.0% (Baseline)</text>
  <line x1="40" y1="200" x2="760" y2="200" stroke="#1e293b" stroke-width="1" />

  <!-- Row 2 -->
  <text x="60" y="235" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700">Q8_0 (8-Bit Quantized)</text>
  <text x="260" y="235" fill="#fef08a" font-family="monospace" font-size="13">7.9 GB</text>
  <text x="450" y="235" fill="#cbd5e1" font-family="monospace" font-size="13">34 - 42 t/s</text>
  <text x="660" y="235" fill="#cbd5e1" font-family="monospace" font-size="13">99.4%</text>
  <line x1="40" y1="255" x2="760" y2="255" stroke="#1e293b" stroke-width="1" />

  <!-- Row 3 (Recommended) -->
  <rect x="42" y="260" width="716" height="50" fill="#312e81" opacity="0.4" />
  <text x="60" y="290" fill="#818cf8" font-family="monospace" font-size="13" font-weight="700">Q4_K_M (Recommended Standard)</text>
  <text x="260" y="290" fill="#86efac" font-family="monospace" font-size="13" font-weight="700">4.6 GB (Zero Cost Fit)</text>
  <text x="450" y="290" fill="#86efac" font-family="monospace" font-size="13" font-weight="700">55 - 72 t/s</text>
  <text x="660" y="290" fill="#86efac" font-family="monospace" font-size="13" font-weight="700">98.1% (Lossless Task)</text>
  <line x1="40" y1="315" x2="760" y2="315" stroke="#1e293b" stroke-width="1" />

  <!-- Row 4 -->
  <text x="60" y="350" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700">Q2_K (Extreme Low-Bit)</text>
  <text x="260" y="350" fill="#86efac" font-family="monospace" font-size="13">2.8 GB</text>
  <text x="450" y="350" fill="#cbd5e1" font-family="monospace" font-size="13">80+ t/s</text>
  <text x="660" y="350" fill="#fca5a5" font-family="monospace" font-size="13">84.2% (Degraded)</text>

  <!-- Summary Footer Note -->
  <rect x="60" y="375" width="680" height="25" rx="6" fill="#1e293b" />
  <text x="75" y="392" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Production Standard: Q4_K_M provides optimal reasoning preservation while fitting safely into consumer RAM.</text>
</svg>

