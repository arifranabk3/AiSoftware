<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBoxArgon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgBoxArgon1)" stroke="#334155" stroke-width="2" />

  <text x="40" y="50" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FIGURE 1: MEMORY-HARD KEY DERIVATION PIPELINE</text>
  <text x="40" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Argon2id Internal Block Matrix &amp; Sequential Memory Access</text>

  <!-- Input Phase -->
  <rect x="40" y="125" width="180" height="130" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="40" y="125" width="180" height="6" rx="3" fill="#6366f1" />
  <text x="55" y="155" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Inputs &amp; Salting</text>
  <text x="55" y="180" fill="#94a3b8" font-family="monospace" font-size="11">• Plaintext Password</text>
  <text x="55" y="200" fill="#94a3b8" font-family="monospace" font-size="11">• 16-byte CSPRNG Salt</text>
  <text x="55" y="220" fill="#94a3b8" font-family="monospace" font-size="11">• Associated Secret Key</text>
  <text x="55" y="240" fill="#818cf8" font-family="monospace" font-size="10">Blake2b Pre-Hashing</text>

  <!-- Arrow -->
  <path d="M 220 190 L 270 190" stroke="#818cf8" stroke-width="2.5" />
  <polygon points="275,190 265,185 265,195" fill="#818cf8" />

  <!-- Memory Matrix Grid Block -->
  <rect x="280" y="125" width="240" height="130" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
  <text x="300" y="155" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Memory Matrix Allocation</text>
  <text x="300" y="180" fill="#10b981" font-family="monospace" font-size="11">m_cost: 19,456 KiB (19 MB)</text>
  
  <!-- Mini memory blocks -->
  <g fill="#312e81" stroke="#6366f1" stroke-width="1">
    <rect x="300" y="195" width="22" height="22" rx="4" />
    <rect x="328" y="195" width="22" height="22" rx="4" />
    <rect x="356" y="195" width="22" height="22" rx="4" fill="#4338ca" />
    <rect x="384" y="195" width="22" height="22" rx="4" />
    <rect x="412" y="195" width="22" height="22" rx="4" />
    <rect x="440" y="195" width="22" height="22" rx="4" fill="#10b981" />
  </g>
  <text x="300" y="242" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Data-independent + Data-dependent passes</text>

  <!-- Arrow -->
  <path d="M 520 190 L 570 190" stroke="#10b981" stroke-width="2.5" />
  <polygon points="575,190 565,185 565,195" fill="#10b981" />

  <!-- Output Hash String -->
  <rect x="580" y="125" width="180" height="130" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <rect x="580" y="125" width="180" height="6" rx="3" fill="#10b981" />
  <text x="595" y="155" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Encoded Output</text>
  <text x="595" y="180" fill="#94a3b8" font-family="monospace" font-size="10">$argon2id$v=19$</text>
  <text x="595" y="198" fill="#94a3b8" font-family="monospace" font-size="10">m=19456,t=2,p=1$</text>
  <text x="595" y="216" fill="#86efac" font-family="monospace" font-size="10">salt_b64$...hash_b64</text>
  <text x="595" y="240" fill="#10b981" font-family="system-ui" font-size="10" font-weight="600">Self-Contained Params</text>

  <!-- Comparison Panel -->
  <rect x="40" y="280" width="720" height="130" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="310" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Why Legacy Hashes Fail Against Modern GPU Password Clusters:</text>
  
  <text x="60" y="340" fill="#cbd5e1" font-family="monospace" font-size="11">MD5 / SHA-256 (0 MB RAM):</text>
  <text x="260" y="340" fill="#fca5a5" font-family="monospace" font-size="11">&gt; 100 Billion hashes/sec on single RTX 4090 (Fatal Risk)</text>

  <text x="60" y="365" fill="#cbd5e1" font-family="monospace" font-size="11">bcrypt (4 KiB RAM):</text>
  <text x="260" y="365" fill="#fef08a" font-family="monospace" font-size="11">~150,000 hashes/sec on custom FPGA arrays (Vulnerable)</text>

  <text x="60" y="390" fill="#cbd5e1" font-family="monospace" font-size="11">Argon2id (19,456 KiB RAM):</text>
  <text x="260" y="390" fill="#86efac" font-family="monospace" font-size="11">&lt; 15 hashes/sec across entire GPU board (Massive Economic Wall)</text>
</svg>
