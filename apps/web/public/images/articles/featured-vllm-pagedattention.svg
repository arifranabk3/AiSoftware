<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="34" rx="17" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1.5" />
  <circle cx="100" cy="87" r="5" fill="#38bdf8" filter="url(#glow)" />
  <text x="116" y="92" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AI &amp; LOCAL LLMS</text>

  <!-- Title & Subtitle -->
  <text x="80" y="160" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">vLLM PagedAttention</text>
  <text x="80" y="215" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Memory Management on Sovereign Hardware</text>
  <text x="80" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Virtual Memory Paging Principles Applied to High-Throughput KV-Cache Allocation</text>

  <!-- Visual Memory Blocks Diagram -->
  <g transform="translate(80, 300)">
    <!-- Virtual Logical KV Blocks -->
    <rect x="0" y="0" width="480" height="240" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Logical KV Blocks (Contiguous Sequence)</text>
    <text x="24" y="60" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Sequence Tokens [0..15] mapped to non-contiguous physical pages</text>

    <!-- Logical Page Blocks -->
    <rect x="24" y="80" width="96" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="44" y="105" fill="#e2e8f0" font-family="monospace" font-size="12">Block 0</text>
    <text x="36" y="122" fill="#94a3b8" font-family="monospace" font-size="10">Tokens 0-3</text>

    <rect x="132" y="80" width="96" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="152" y="105" fill="#e2e8f0" font-family="monospace" font-size="12">Block 1</text>
    <text x="144" y="122" fill="#94a3b8" font-family="monospace" font-size="10">Tokens 4-7</text>

    <rect x="240" y="80" width="96" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="260" y="105" fill="#e2e8f0" font-family="monospace" font-size="12">Block 2</text>
    <text x="250" y="122" fill="#94a3b8" font-family="monospace" font-size="10">Tokens 8-11</text>

    <rect x="348" y="80" width="108" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="372" y="105" fill="#e2e8f0" font-family="monospace" font-size="12">Block 3</text>
    <text x="358" y="122" fill="#94a3b8" font-family="monospace" font-size="10">Tokens 12-15</text>

    <!-- Block Table Pointer Mapping -->
    <rect x="24" y="150" width="432" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="36" y="174" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Block Table Lookup (Virtual Page â†’ Physical Frame)</text>
    <text x="36" y="198" fill="#38bdf8" font-family="monospace" font-size="11">Block 0 â†’ Frame 7 | Block 1 â†’ Frame 2 | Block 2 â†’ Frame 11 | Block 3 â†’ Frame 4</text>

    <!-- Physical VRAM Frame Pool -->
    <rect x="540" y="0" width="500" height="240" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
    <text x="564" y="36" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Physical GPU VRAM Page Allocation</text>
    <text x="564" y="60" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Zero-fragmentation non-contiguous physical memory frames</text>

    <!-- Grid of physical memory frames -->
    <g transform="translate(564, 80)">
      <rect x="0" y="0" width="70" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="25" fill="#64748b" font-family="monospace" font-size="11">Frame 0</text>

      <rect x="80" y="0" width="70" height="42" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
      <text x="94" y="25" fill="#34d399" font-family="monospace" font-size="11">Frame 2</text>

      <rect x="160" y="0" width="70" height="42" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
      <text x="174" y="25" fill="#34d399" font-family="monospace" font-size="11">Frame 4</text>

      <rect x="240" y="0" width="70" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="254" y="25" fill="#64748b" font-family="monospace" font-size="11">Frame 5</text>

      <rect x="320" y="0" width="70" height="42" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
      <text x="334" y="25" fill="#34d399" font-family="monospace" font-size="11">Frame 7</text>

      <rect x="400" y="0" width="70" height="42" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
      <text x="412" y="25" fill="#34d399" font-family="monospace" font-size="11">Frame 11</text>
    </g>

    <!-- VRAM Utilization Metric -->
    <rect x="564" y="150" width="452" height="65" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
    <text x="580" y="176" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Memory Efficiency Comparison</text>
    <text x="580" y="198" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">Traditional Static KV: 20-40% VRAM waste â€¢ PagedAttention: &lt;4% waste</text>
  </g>
</svg>

