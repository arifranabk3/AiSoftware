<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradArgon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="argonKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadowGlowIndigo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradArgon)" />

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.3">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Left: Stylized Memory-Hard Cryptographic Safe -->
  <g filter="url(#shadowGlowIndigo)">
    <rect x="120" y="140" width="380" height="380" rx="24" fill="#0f172a" stroke="#6366f1" stroke-width="2.5" />
    <rect x="120" y="140" width="380" height="10" rx="5" fill="#818cf8" />

    <!-- Memory Hardness Dial -->
    <circle cx="310" cy="270" r="85" fill="#1e1b4b" stroke="#4f46e5" stroke-width="3" />
    <circle cx="310" cy="270" r="60" fill="#0f172a" stroke="#6366f1" stroke-width="2" stroke-dasharray="6" />
    <circle cx="310" cy="270" r="14" fill="#818cf8" />
    <path d="M 310 270 L 350 240" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />

    <text x="310" y="380" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">ARGON2ID TUNING</text>
    <text x="310" y="405" fill="#818cf8" font-family="monospace" font-size="12" text-anchor="middle">m=19456 (19 MB) • t=2 • p=1</text>
    <text x="310" y="428" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">GPU &amp; ASIC Resistance: Optimal</text>

    <!-- Side status indicators -->
    <circle cx="160" cy="180" r="6" fill="#10b981" />
    <circle cx="180" cy="180" r="6" fill="#38bdf8" />
    <text x="205" y="185" fill="#cbd5e1" font-family="monospace" font-size="11">RFC 9106 Standard</text>
  </g>

  <!-- Flow Connection to Specification Cards -->
  <path d="M 500 330 L 590 330" stroke="#818cf8" stroke-width="3" stroke-dasharray="5" />
  <polygon points="595,330 585,325 585,335" fill="#818cf8" />

  <!-- Right: Architecture Explanatory Cards -->
  <!-- Card 1: Memory-Hard Defense -->
  <g>
    <rect x="600" y="140" width="480" height="105" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="600" y="140" width="10" height="105" rx="5" fill="#6366f1" />
    <text x="630" y="175" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800">1. Hybrid Argon2id Architecture</text>
    <text x="630" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Combines Argon2i (side-channel resistance) with Argon2d</text>
    <text x="630" y="222" fill="#818cf8" font-family="monospace" font-size="11">Defense: Defeats massive GPU/ASIC password cracking clusters</text>
  </g>

  <!-- Card 2: Password Hashing vs Fast Hashes -->
  <g>
    <rect x="600" y="275" width="480" height="105" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="600" y="275" width="10" height="105" rx="5" fill="#10b981" />
    <text x="630" y="310" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800">2. Modern Web Storage Standard</text>
    <text x="630" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Superior to bcrypt, PBKDF2, and scrypt across cost surfaces</text>
    <text x="630" y="357" fill="#34d399" font-family="monospace" font-size="11">Execution: ~120ms verification latency per login check</text>
  </g>

  <!-- Card 3: Enterprise Auth Session Chain -->
  <g>
    <rect x="600" y="410" width="480" height="105" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="600" y="410" width="10" height="105" rx="5" fill="#38bdf8" />
    <text x="630" y="445" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800">3. Cryptographic Session Linkage</text>
    <text x="630" y="470" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Pairs Argon2id master password with hashed refresh tokens</text>
    <text x="630" y="492" fill="#38bdf8" font-family="monospace" font-size="11">Protection: Zero plaintext credentials stored in database</text>
  </g>

  <!-- Category Tag -->
  <rect x="120" y="65" width="220" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <circle cx="138" cy="83" r="5" fill="#818cf8" />
  <text x="152" y="88" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AUTHENTICATION &amp; CRYPTO</text>

  <!-- Brand Mark -->
  <text x="1080" y="585" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">AIsoftware Engineering Library</text>
</svg>
