<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="796" height="446" rx="14" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <text x="40" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FIGURE 2: ATOMIC IDEMPOTENCY & DUPLICATE PROTECTION</text>
  <text x="40" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Preventing Duplicate Agent Executions Across Distributed Network Retries</text>

  <!-- Flow Scenario -->
  <!-- Step 1: Incoming Job with Key -->
  <rect x="40" y="130" width="220" height="130" rx="12" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5" />
  <text x="60" y="160" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. Job Admission</text>
  <text x="60" y="185" fill="#94a3b8" font-family="monospace" font-size="11">Job Payload Received</text>
  <rect x="55" y="200" width="190" height="45" rx="6" fill="#0f172a" />
  <text x="65" y="218" fill="#38bdf8" font-family="monospace" font-size="10">IdempotencyKey:</text>
  <text x="65" y="234" fill="#cbd5e1" font-family="monospace" font-size="10">&quot;exec_obj_1042_step_1&quot;</text>

  <!-- Arrow to Redis SetNX -->
  <path d="M 260 195 L 310 195" stroke="#38bdf8" stroke-width="2.5" />
  <polygon points="315,195 305,190 305,200" fill="#38bdf8" />

  <!-- Step 2: Atomic Lock Evaluation -->
  <rect x="320" y="130" width="220" height="130" rx="12" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="2" />
  <text x="340" y="160" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Redis SETNX Lock</text>
  <text x="340" y="185" fill="#cbd5e1" font-family="monospace" font-size="11">SET key &quot;LOCKED&quot;</text>
  <text x="340" y="205" fill="#cbd5e1" font-family="monospace" font-size="11">EX 300 NX</text>
  <text x="340" y="235" fill="#fef08a" font-family="system-ui" font-size="11" font-weight="600">Atomic Primitive Check</text>

  <!-- Branches -->
  <!-- Branch A: Key Acquired (Down) -->
  <path d="M 430 260 L 430 300" stroke="#10b981" stroke-width="2.5" />
  <polygon points="430,305 425,295 435,295" fill="#10b981" />

  <rect x="320" y="310" width="220" height="90" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="340" y="340" fill="#86efac" font-family="system-ui" font-size="13" font-weight="700">STATUS: FIRST DELIVERY</text>
  <text x="340" y="362" fill="#d1fae5" font-family="system-ui" font-size="11">Acquires processing lock.</text>
  <text x="340" y="380" fill="#d1fae5" font-family="system-ui" font-size="11">Dispatches to Agent Worker.</text>

  <!-- Branch B: Duplicate Delivery (Right) -->
  <path d="M 540 195 L 590 195" stroke="#ef4444" stroke-width="2.5" />
  <polygon points="595,195 585,190 585,200" fill="#ef4444" />

  <rect x="600" y="130" width="160" height="130" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
  <text x="615" y="160" fill="#fca5a5" font-family="system-ui" font-size="12" font-weight="800">DUPLICATE DETECTED</text>
  <text x="615" y="185" fill="#fecaca" font-family="system-ui" font-size="11">SETNX returns 0</text>
  <text x="615" y="210" fill="#fecaca" font-family="system-ui" font-size="10">• Drops duplicate job</text>
  <text x="615" y="228" fill="#fecaca" font-family="system-ui" font-size="10">• No double side-effect</text>
  <text x="615" y="246" fill="#fecaca" font-family="system-ui" font-size="10">• Returns cached state</text>
</svg>

