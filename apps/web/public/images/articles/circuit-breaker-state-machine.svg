<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="900" height="480" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Circuit Breaker Finite State Machine Topology</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">State Transitions, Failure Thresholds, and Fast-Fallback Interception</text>

  <!-- State 1: CLOSED -->
  <rect x="60" y="140" width="220" height="200" rx="12" fill="#0c1d19" stroke="#10b981" stroke-width="2" />
  <circle cx="170" cy="190" r="30" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <text x="170" y="196" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">CLOSED</text>
  <text x="170" y="245" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Normal Tool Calls</text>
  <text x="170" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Requests pass directly</text>
  <text x="170" y="285" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">error_count &lt; 5</text>

  <!-- Transition: CLOSED -> OPEN (Trip on Failures) -->
  <path d="M 280 200 L 600 200" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)" />
  <rect x="360" y="165" width="160" height="30" rx="4" fill="#2d1215" stroke="#ef4444" stroke-width="1" />
  <text x="440" y="184" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">5 Consecutive Failures</text>

  <!-- State 2: OPEN -->
  <rect x="620" y="140" width="220" height="200" rx="12" fill="#241215" stroke="#ef4444" stroke-width="2" />
  <circle cx="730" cy="190" r="30" fill="#7f1d1d" stroke="#f87171" stroke-width="2" />
  <text x="730" y="196" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">OPEN</text>
  <text x="730" y="245" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Fast Fail Active</text>
  <text x="730" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">No upstream calls</text>
  <text x="730" y="285" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">return FastFallback()</text>

  <!-- Transition: OPEN -> HALF-OPEN (Cooldown Expired) -->
  <path d="M 680 340 L 520 400" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
  <rect x="560" y="380" width="150" height="26" rx="4" fill="#2d2210" stroke="#f59e0b" stroke-width="1" />
  <text x="635" y="397" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cooldown (30s) Expired</text>

  <!-- State 3: HALF-OPEN -->
  <rect x="340" y="350" width="220" height="110" rx="12" fill="#241c10" stroke="#f59e0b" stroke-width="2" />
  <circle cx="450" cy="390" r="24" fill="#78350f" stroke="#fbbf24" stroke-width="2" />
  <text x="450" y="395" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">HALF-OPEN</text>
  <text x="450" y="430" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Canary Probe Mode</text>
  <text x="450" y="446" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Single trial execution allowed</text>

  <!-- Transition: HALF-OPEN -> CLOSED (Probe Succeeded) -->
  <path d="M 340 400 L 220 340" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="190" y="380" width="140" height="26" rx="4" fill="#091c16" stroke="#10b981" stroke-width="1" />
  <text x="260" y="397" fill="#86efac" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Canary Succeeded</text>

  <!-- Transition: HALF-OPEN -> OPEN (Probe Failed) -->
  <path d="M 450 350 L 510 270 L 620 250" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)" />
  <rect x="470" y="280" width="130" height="24" rx="4" fill="#2d1215" stroke="#ef4444" stroke-width="1" />
  <text x="535" y="296" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Canary Failed (Re-trip)</text>
</svg>
