    <text x="175" y="415" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1">MARGINAL TOKEN EXPENDITURE</text>
    <text x="175" y="465" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900">$0.00</text>
    <text x="315" y="460" fill="#a7f3d0" font-family="monospace" font-size="13">/ token inference</text>
  </g>

  <!-- Flow Connector Rays to Neural Nodes -->
