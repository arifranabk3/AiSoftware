    <circle cx="725" cy="327" r="22" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="716" y="333" fill="#ffffff" font-family="monospace" font-size="14" font-weight="700">02</text>
    <text x="765" y="320" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Technical Content Architect</text>
    <text x="765" y="340" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">JSON structured schema generation</text>
