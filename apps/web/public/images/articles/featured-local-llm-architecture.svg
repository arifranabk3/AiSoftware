  <path d="M 500 330 C 580 330, 600 330, 680 330" stroke="#10b981" stroke-width="3" fill="none" />
  <path d="M 500 330 C 580 330, 600 420, 680 420" stroke="#38bdf8" stroke-width="3" fill="none" stroke-dasharray="6" />

