    <circle cx="180" cy="217" r="12" fill="#10b981" />
    <circle cx="215" cy="217" r="6" fill="#38bdf8" />
    <circle cx="235" cy="217" r="6" fill="#818cf8" />
    <text x="270" y="222" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Ollama Local Daemon</text>
    <text x="270" y="240" fill="#94a3b8" font-family="monospace" font-size="11">127.0.0.1:11434 &#8226; Online</text>

    <rect x="150" y="275" width="320" height="85" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="175" y="295" width="45" height="45" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
    <text x="187" y="324" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Q4</text>
    <text x="235" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Qwen 2.5 7B / Llama 3.2</text>
