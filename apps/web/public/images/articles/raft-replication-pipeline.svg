<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-raft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrow-raft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg-raft)" rx="12" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" rx="8" />

  <text x="400" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Raft Log Replication &amp; Two-Phase Commit Sequence</text>
  <text x="400" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Step-by-step consensus from agent proposal to state machine apply</text>

  <!-- Step 1: Proposal -->
  <g transform="translate(40, 130)">
    <rect width="160" height="110" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect width="160" height="26" rx="8" fill="#2563eb" />
    <text x="80" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. Agent Action</text>
    <text x="12" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Command: UPDATE_ROUTE</text>
    <text x="12" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Received at Leader</text>
    <text x="12" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Append to Local Log</text>
  </g>

  <line x1="200" y1="185" x2="260" y2="185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-raft)" />

  <!-- Step 2: AppendEntries RPC -->
  <g transform="translate(270, 130)">
    <rect width="200" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect width="200" height="26" rx="8" fill="#d97706" />
    <text x="100" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. AppendEntries RPC</text>
    <text x="12" y="50" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10">Broadcast to Followers</text>
    <text x="12" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Leader Term: 14</text>
    <text x="12" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">PrevLogIndex: 1041</text>
  </g>

  <line x1="470" y1="185" x2="530" y2="185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-raft)" />

  <!-- Step 3: Quorum Ack -->
  <g transform="translate(540, 120)">
    <rect width="220" height="130" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect width="220" height="26" rx="8" fill="#059669" />
    <text x="110" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. Majority Quorum Ack</text>
    <text x="15" y="50" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">Follower-01: ACK [OK]</text>
    <text x="15" y="70" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">Follower-02: ACK [OK]</text>
    <text x="15" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Quorum Achieved (3 of 3)</text>
    <text x="15" y="110" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700">CommitIndex = 1042</text>
  </g>

  <!-- Step 4: State Machine Apply -->
  <g transform="translate(200, 310)">
    <rect width="400" height="85" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect width="400" height="26" rx="8" fill="#7c3aed" />
    <text x="200" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4. State Machine Application &amp; Client Response</text>
    <text x="15" y="48" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Log entry executed atomically across cluster state machines.</text>
    <text x="15" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Client returns HTTP 200 with deterministic state commitment.</text>
  </g>
</svg>
