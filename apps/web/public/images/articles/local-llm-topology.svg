<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="796" height="446" rx="14" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <text x="40" y="50" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FIGURE 1: LOCAL QUANTIZED INFERENCE TOPOLOGY</text>
  <text x="40" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Decoupled Reasoning Pipeline & Memory Allocation</text>

  <!-- Node 1: Fastify API -->
  <rect x="40" y="120" width="200" height="130" rx="12" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5" />
  <rect x="40" y="120" width="200" height="6" rx="3" fill="#6366f1" />
  <text x="60" y="155" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">1. Client / Fastify</text>
  <text x="60" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">REST & SSE Telemetry</text>
  <text x="60" y="202" fill="#cbd5e1" font-family="monospace" font-size="11">Input: Objective Prompt</text>
  <text x="60" y="222" fill="#cbd5e1" font-family="monospace" font-size="11">Context: &lt; 4,096 tokens</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 240 185 L 290 185" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4" />
  <polygon points="295,185 285,180 285,190" fill="#818cf8" />

  <!-- Node 2: Ollama Local Daemon -->
  <rect x="300" y="120" width="220" height="130" rx="12" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="2" />
  <rect x="300" y="120" width="220" height="6" rx="3" fill="#10b981" />
  <text x="320" y="155" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">2. Local Ollama Daemon</text>
  <text x="320" y="180" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Port 11434 (Loopback Only)</text>
  <text x="320" y="202" fill="#cbd5e1" font-family="monospace" font-size="11">Qwen 2.5 7B / Llama 3.2</text>
  <text x="320" y="222" fill="#cbd5e1" font-family="monospace" font-size="11">4-Bit Q4_K_M Quantized</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 520 185 L 570 185" stroke="#10b981" stroke-width="2.5" />
  <polygon points="575,185 565,180 565,190" fill="#10b981" />

  <!-- Node 3: Unified Memory / VRAM -->
  <rect x="580" y="120" width="180" height="130" rx="12" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5" />
  <rect x="580" y="120" width="180" height="6" rx="3" fill="#f59e0b" />
  <text x="600" y="155" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">3. Hardware VRAM</text>
  <text x="600" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Memory Footprint</text>
  <text x="600" y="202" fill="#f59e0b" font-family="monospace" font-size="11">Weight RAM: ~4.5 GB</text>
  <text x="600" y="222" fill="#f59e0b" font-family="monospace" font-size="11">KV-Cache: ~0.8 GB</text>

  <!-- Bottom Panel: Financial Comparison Bar -->
  <rect x="40" y="280" width="720" height="130" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="312" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MARGINAL COST PER 1,000 EXECUTIONS</text>

  <!-- Cost Bar 1 -->
  <text x="60" y="345" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Cloud Proprietary API (GPT-4o / Claude 3.5)</text>
  <rect x="360" y="332" width="300" height="18" rx="6" fill="#ef4444" />
  <text x="670" y="346" fill="#fca5a5" font-family="monospace" font-size="13" font-weight="700">~$480.00</text>

  <!-- Cost Bar 2 -->
  <text x="60" y="385" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Local Quantized LLM (AIsoftware Architecture)</text>
  <rect x="360" y="372" width="6" height="18" rx="3" fill="#10b981" />
  <text x="375" y="386" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="700">$0.00 Marginal Inference</text>
</svg>

