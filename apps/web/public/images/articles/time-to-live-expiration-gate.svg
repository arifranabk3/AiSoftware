<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad2)" rx="12" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" rx="8" />

  <!-- Title -->
  <text x="400" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Approval Request Time-To-Live (TTL) &amp; Escalation State Machine</text>
  <text x="400" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Deterministic states preventing stale action execution or abandoned authorization requests</text>

  <!-- States -->
  <!-- State 1: PENDING -->
  <g transform="translate(50, 150)">
    <circle cx="65" cy="65" r="55" fill="#1e293b" stroke="#3b82f6" stroke-width="3" />
    <text x="65" y="60" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PENDING</text>
    <text x="65" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">TTL: 4 Hours</text>
  </g>

  <!-- Transition 1: Warning at T-1hr -->
  <path d="M 180 215 L 290 215" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow2)" />
  <text x="235" y="205" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">T - 1h Reminder</text>

  <!-- State 2: ESCALATED -->
  <g transform="translate(300, 150)">
    <circle cx="65" cy="65" r="55" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
    <text x="65" y="60" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ESCALATED</text>
    <text x="65" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Secondary Tier</text>
  </g>

  <!-- Transition 2: Timeout reached -->
  <path d="M 430 215 L 540 215" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="485" y="205" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TTL Elapsed</text>

  <!-- State 3: EXPIRED / REVOKED -->
  <g transform="translate(550, 150)">
    <circle cx="65" cy="65" r="55" fill="#1e293b" stroke="#ef4444" stroke-width="3" />
    <text x="65" y="60" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">EXPIRED</text>
    <text x="65" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Auto-Rejected</text>
  </g>

  <!-- Branch: Approved Path from Pending or Escalated to EXECUTED -->
  <path d="M 115 150 C 115 100, 390 100, 390 100 C 390 100, 680 100, 680 300 L 460 360" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
  
  <!-- State 4: EXECUTED (Bottom Center) -->
  <g transform="translate(260, 320)">
    <rect width="280" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
    <text x="140" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">STATE: APPROVED &amp; EXECUTED</text>
    <text x="140" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Requires valid signatures prior to TTL deadline</text>
  </g>

  <!-- Direct approval arrow down to Executed -->
  <path d="M 365 270 L 365 315" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow2)" />
  <text x="400" y="295" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Signed OK</text>
</svg>
