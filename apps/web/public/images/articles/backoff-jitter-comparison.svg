<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Comparative Analysis: Exponential Backoff vs. Full Jitter</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Eliminating Resynchronization Spikes and Clustered Collisions in Multi-Agent Fleets</text>

  <!-- Left: Naive Exponential Backoff (Spike Hazard) -->
  <rect x="40" y="100" width="390" height="340" rx="8" fill="#171216" stroke="#ef4444" stroke-width="1.5" />
  <rect x="40" y="100" width="390" height="35" rx="8" fill="#7f1d1d" />
  <text x="55" y="123" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. Deterministic Backoff (High Collision Risk)</text>

  <rect x="55" y="150" width="360" height="130" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  <!-- Discrete step graph with clustered spikes -->
  <line x1="75" y1="260" x2="395" y2="260" stroke="#475569" stroke-width="1.5" />
  <line x1="75" y1="170" x2="75" y2="260" stroke="#475569" stroke-width="1.5" />

  <!-- Synchronized agent impulses -->
  <rect x="110" y="190" width="8" height="70" fill="#ef4444" />
  <rect x="180" y="180" width="8" height="80" fill="#ef4444" />
  <rect x="270" y="170" width="8" height="90" fill="#ef4444" />
  <rect x="360" y="170" width="8" height="90" fill="#ef4444" />
  <text x="120" y="185" fill="#f87171" font-family="monospace" font-size="10">Retry 1 (1s)</text>
  <text x="190" y="175" fill="#f87171" font-family="monospace" font-size="10">Retry 2 (2s)</text>
  <text x="280" y="165" fill="#f87171" font-family="monospace" font-size="10">Retry 3 (4s)</text>

  <text x="55" y="305" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Formula:</text>
  <text x="55" y="325" fill="#f87171" font-family="monospace" font-size="12">t = min(max_delay, base * 2^attempt)</text>
  <text x="55" y="355" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Why it fails in multi-agent swarms:</text>
  <text x="55" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&#8226; 20 agents fail simultaneously at T=0</text>
  <text x="55" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&#8226; All 20 agents wake up exactly at T=1.00s</text>
  <text x="55" y="415" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">&#8226; Causes repeating periodic thundering herds</text>

  <!-- Right: Decorrelated Full Jitter Backoff (Smooth Dispersion) -->
  <rect x="470" y="100" width="390" height="340" rx="8" fill="#0f1d17" stroke="#10b981" stroke-width="1.5" />
  <rect x="470" y="100" width="390" height="35" rx="8" fill="#064e3b" />
  <text x="485" y="123" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Decorrelated Full Jitter (Even Distribution)</text>

  <rect x="485" y="150" width="360" height="130" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  <!-- Smooth dispersed points -->
  <line x1="505" y1="260" x2="825" y2="260" stroke="#475569" stroke-width="1.5" />
  <line x1="505" y1="170" x2="505" y2="260" stroke="#475569" stroke-width="1.5" />

  <!-- Uniformly dispersed impulses -->
  <rect x="520" y="235" width="4" height="25" fill="#10b981" />
  <rect x="540" y="240" width="4" height="20" fill="#10b981" />
  <rect x="565" y="230" width="4" height="30" fill="#10b981" />
  <rect x="590" y="245" width="4" height="15" fill="#10b981" />
  <rect x="625" y="235" width="4" height="25" fill="#10b981" />
  <rect x="660" y="240" width="4" height="20" fill="#10b981" />
  <rect x="710" y="245" width="4" height="15" fill="#10b981" />
  <rect x="760" y="240" width="4" height="20" fill="#10b981" />
  <rect x="800" y="235" width="4" height="25" fill="#10b981" />
  <text x="530" y="185" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Completely smoothed arrival traffic</text>

  <text x="485" y="305" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Formula:</text>
  <text x="485" y="325" fill="#34d399" font-family="monospace" font-size="12">t = random(0, min(max_delay, base * 2^attempt))</text>
  <text x="485" y="355" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Why it succeeds in multi-agent swarms:</text>
  <text x="485" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&#8226; 20 agents fail simultaneously at T=0</text>
  <text x="485" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&#8226; Retries disperse continuously across [0, 1.0s]</text>
  <text x="485" y="415" fill="#86efac" font-family="system-ui, sans-serif" font-size="11">&#8226; Zero spike correlation; instant upstream recovery</text>
</svg>
