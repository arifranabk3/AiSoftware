<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top Badge -->
  <rect x="80" y="55" width="260" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="102" cy="71" r="5" fill="#06b6d4" filter="url(#glow)" />
  <text x="118" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">RELIABILITY & RESILIENCE</text>

  <!-- Main Title & Subtitle -->
  <text x="80" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Distributed Rate Limiting & Token Bucket Algorithms</text>
  <text x="80" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18" font-weight="400">Atomic Redis Lua Scripts, Sliding Logs, and Tiered Throttling for Autonomous LLM Agents</text>

  <!-- Central Architectural Canvas -->
  <rect x="80" y="210" width="1040" height="360" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="2" />

  <!-- Column 1: Client Agents Traffic Burst -->
  <rect x="110" y="240" width="240" height="300" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="130" y="275" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Multi-Agent Ingestion</text>
  <text x="130" y="295" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Unsynchronized Request Bursts</text>

  <rect x="130" y="320" width="200" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="145" y="346" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Agent Alpha (Search Tool)</text>

  <rect x="130" y="375" width="200" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="145" y="401" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Agent Beta (Code Gen)</text>

  <rect x="130" y="430" width="200" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="145" y="456" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Agent Gamma (Reviewer)</text>

  <path d="M 130 495 L 330 495" stroke="#334155" stroke-dasharray="4,4" stroke-width="1" />
  <text x="160" y="520" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Peak Load: 450 req/sec</text>

  <!-- Connectors from Clients to Limiter -->
  <path d="M 350 341 L 430 341 L 430 380 L 470 380" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 350 396 L 470 396" fill="none" stroke="#06b6d4" stroke-width="2" />
  <path d="M 350 451 L 430 451 L 430 410 L 470 410" fill="none" stroke="#06b6d4" stroke-width="2" />

  <!-- Column 2: Distributed Rate Limiter Gateway -->
  <rect x="470" y="240" width="300" height="300" rx="8" fill="#111c35" stroke="#0284c7" stroke-width="1.5" />
  <text x="495" y="275" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Atomic Token Bucket</text>
  <text x="495" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Redis Lua Execution Engine</text>

  <!-- Token Bucket Reservoir Visual -->
  <rect x="495" y="320" width="250" height="130" rx="6" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
  <text x="510" y="342" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Bucket Capacity: 100 Tokens</text>
  <text x="510" y="360" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Refill Rate: 20 tokens / sec</text>

  <!-- Token Level Indicator -->
  <rect x="510" y="375" width="220" height="20" rx="4" fill="#1e293b" />
  <rect x="510" y="375" width="155" height="20" rx="4" fill="url(#cyanGlow)" />
  <text x="575" y="390" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">70% Filled</text>

  <rect x="510" y="410" width="220" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="525" y="428" fill="#38bdf8" font-family="monospace" font-size="11">EVALSHA token_bucket.lua</text>

  <!-- Decision Junction -->
  <text x="515" y="485" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Within Limit (Tokens Remaining)</text>
  <text x="515" y="512" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✗ Limit Exhausted (HTTP 429 Retry)</text>

  <!-- Path to Target APIs -->
  <path d="M 770 480 L 850 480" fill="none" stroke="#22c55e" stroke-width="2.5" />
  <path d="M 770 508 L 820 508 L 820 520 L 850 520" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Column 3: Upstream APIs & Backpressure -->
  <rect x="850" y="240" width="240" height="300" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="875" y="275" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Protected Services</text>
  <text x="875" y="295" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Sovereign LLMs & APIs</text>

  <rect x="870" y="320" width="200" height="60" rx="6" fill="#132338" stroke="#0284c7" stroke-width="1" />
  <text x="885" y="345" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Ollama Local LLM</text>
  <text x="885" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Smooth Traffic Concurrency</text>

  <rect x="870" y="395" width="200" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="885" y="420" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Search Engine API</text>
  <text x="885" y="440" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Zero Over-Quota Charges</text>

  <rect x="870" y="470" width="200" height="50" rx="6" fill="#2d1215" stroke="#ef4444" stroke-width="1" />
  <text x="885" y="492" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Adaptive Backoff Queue</text>
  <text x="885" y="508" fill="#f87171" font-family="system-ui, sans-serif" font-size="10">Jittered Exponential Retries</text>
</svg>
